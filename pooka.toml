name = "marksy"
version = "1.0.0"
description = "Markdown, HTML, and TOML front matter for Pooka"
licences = ["Apache-2.0"]
authors = ["Peregrine Finch"]
repository = { type = "github", user = "peregrinefinch", repo = "marksy" }
links = [{ title = "Pooka", href = "https://pooka.run" }]

[dependencies]
pooka_stdlib = ">= 0.3.1 and < 1.0.0"
tome = ">= 1.0.0 and < 2.0.0"

[dev-dependencies]
poke = ">= 1.0.0 and < 2.0.0"
pooka_json = ">= 1.0.0 and < 2.0.0"

[[documentation.pages]]
title = "Reading Markdown"
path = "guide.html"
source = "docs/guide.md"

[[documentation.pages]]
title = "Conformance"
path = "conformance.html"
source = "docs/conformance.md"

[[documentation.pages]]
title = "Licences"
path = "licences.html"
source = "docs/licences.md"
